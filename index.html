<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teacher Angela's Battle Quiz!</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #0a0a1a;
            --p1-color: #ff2e63; 
            --p2-color: #08d9d6; 
            --accent-glow: #7000ff; 
            --panel-bg: rgba(16, 16, 32, 0.8);
            --text-light: #ffffff;
            --hero-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }
        
        body { 
            margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; 
            background: url('battle.gif') center/cover no-repeat fixed; 
            color: var(--text-light); 
            overflow: hidden; -webkit-user-select: none; user-select: none;
            width: 100vw; height: 100vh;
            touch-action: none;
        }

        .global-controls {
            position: fixed; top: 15px; right: 20px;
            display: flex; align-items: center; gap: 10px; z-index: 9999;
        }

        .volume-control-wrapper {
            display: flex; align-items: center; background: var(--panel-bg);
            border-radius: 30px; padding: 5px 15px; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px); transition: all 0.3s;
        }
        
        #volume-slider {
            width: 0; opacity: 0; transition: all 0.3s; cursor: pointer;
            accent-color: var(--accent-glow); margin-left: 0;
        }

        .volume-control-wrapper:hover #volume-slider {
            width: 100px; opacity: 1; margin-left: 10px;
        }

        .quit-btn-container { 
            position: fixed; top: 15px; left: 20px; z-index: 9999; 
        }

        .screen { 
            display: none; 
            position: absolute; 
            width: 100vw; 
            height: 100vh; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            box-sizing: border-box; 
            background: radial-gradient(circle, rgba(10,10,26,0.4) 0%, rgba(10,10,26,0.8) 100%);
            overflow: hidden;
        }
        
        .main-title {
            font-family: 'Bungee Spice', cursive;
            font-size: clamp(40px, 8vw, 85px); text-align: center; margin-bottom: 30px; line-height: 1.1;
            filter: drop-shadow(0 0 15px rgba(255,152,0,0.5)); -webkit-text-stroke: 2px #000;
        }

        #intro-screen { display: flex; }
        #char-select-screen { padding: 10px; justify-content: flex-start; padding-top: 60px; overflow-y: auto; }
        
        .char-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; 
            width: 95%; max-width: 1200px; margin: 0 auto; flex-shrink: 1;
        }
        
        .char-card { 
            background: var(--panel-bg); border: 3px solid rgba(255,255,255,0.1); 
            border-radius: 20px; padding: 5px; cursor: pointer; text-align: center; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            aspect-ratio: 1 / 1; backdrop-filter: blur(10px); box-shadow: var(--hero-shadow);
        }
        
        .char-card img { width: 85%; height: 75%; object-fit: contain; }
        .char-card.selected-p1 { border: 4px solid var(--p1-color); background: rgba(255,46,99,0.2); box-shadow: 0 0 20px var(--p1-color); }
        .char-card.selected-p2 { border: 4px solid var(--p2-color); background: rgba(8,217,214,0.2); box-shadow: 0 0 20px var(--p2-color); }

        #game-screen { display: none; flex-direction: row; background: transparent; overflow: hidden; }
        .player-side { 
            flex: 1; display: flex; flex-direction: column; position: relative; 
            height: 100vh; transition: background 0.3s;
            justify-content: space-between; padding-bottom: 20px;
        }
        
        .health-bar-container { 
            width: 85%; height: 25px; background: #111; border-radius: 6px; margin: 80px auto 5px auto;
            overflow: hidden; border: 2px solid #333; z-index: 200; flex-shrink: 0;
        }
        
        .health-fill { 
            width: 100%; height: 100%; background: linear-gradient(90deg, #00f2ff, #0061ff); 
            transition: width 0.3s ease-out;
        }
        
        .damage-flash-screen { background: rgba(255, 46, 99, 0.3) !important; }

        .avatar-wrapper {
            flex-grow: 1; width: 100%; position: relative; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .avatar-display { 
            width: 500px; height: 500px; background-size: contain; background-repeat: no-repeat; 
            background-position: center bottom; animation: rocking 3s ease-in-out infinite;
            transition: transform 0.1s linear;
        }

        @keyframes rocking { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
        .shiver { animation: shiver-effect 0.1s linear infinite !important; }
        @keyframes shiver-effect { 0% { transform: translate(-8px, -4px); } 50% { transform: translate(8px, 4px); } }

        .quiz-container { 
            padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; 
            z-index: 101; transition: opacity 0.3s, filter 0.3s; width: 100%;
            touch-action: manipulation;
        }
        
        .quiz-container.waiting { opacity: 0.15; filter: grayscale(1); pointer-events: none; }

        .question-box { 
            font-size: clamp(16px, 2.5vh, 22px); text-align: center; margin-bottom: 10px; min-height: 40px; 
            background: rgba(0,0,0,0.85); padding: 12px; border-radius: 12px; width: 90%; 
            border-left: 5px solid var(--accent-glow); color: white;
        }

        .quiz-content-row { display: flex; gap: 10px; width: 95%; align-items: center; justify-content: center; }

        .q-image-square {
            flex: 0 0 clamp(80px, 15vh, 150px); height: clamp(80px, 15vh, 150px); background: rgba(0,0,0,0.5); 
            border: 2px solid var(--accent-glow); border-radius: 12px; display: none;
            background-size: contain; background-position: center; background-repeat: no-repeat;
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-grow: 1; }
        
        .option-btn { 
            padding: clamp(10px, 2vh, 20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; 
            font-family: 'Fredoka'; font-size: clamp(14px, 2vh, 18px); font-weight: bold; cursor: pointer; 
            background: linear-gradient(180deg, #2a2a4a 0%, #16162d 100%); 
            color: #fff; transition: transform 0.1s; touch-action: manipulation;
        }
        .option-btn:active { transform: scale(0.95); background: var(--accent-glow); }

        .btn { 
            padding: 15px 35px; border: none; border-radius: 50px; cursor: pointer; 
            font-weight: bold; font-family: 'Fredoka'; font-size: 18px;
            background: linear-gradient(45deg, var(--accent-glow), #4e00b3);
            color: white; text-transform: uppercase; transition: 0.3s;
        }
        
        #settings-modal { display: none; position: fixed; z-index: 10000; inset: 0; background: rgba(0,0,0,0.95); overflow-y: auto; padding: 20px; }
        .modal-content { background: #1a1a2e; color: #fff; margin: 20px auto; padding: 30px; border-radius: 24px; max-width: 900px; position: relative; border: 1px solid var(--accent-glow); }
        .sentence-row { background: #252545; padding: 20px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #3d3d6d; }
        
        .armory-img-preview {
            width: 80px; height: 80px; border: 1px dashed #666; border-radius: 8px;
            background-size: contain; background-position: center; background-repeat: no-repeat;
            cursor: pointer; position: relative; background-color: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop src="battlebg.mp3"></audio>
    <audio id="sfx-p1-attack" src="p1.mp3"></audio>
    <audio id="sfx-p2-attack" src="p2.mp3"></audio>
    <audio id="sfx-p1-lose" src="l1.mp3"></audio>
    <audio id="sfx-p2-lose" src="l2.mp3"></audio>

    <div class="global-controls">
        <button class="round-btn" onclick="toggleFullscreen()" style="background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer;">⛶</button>
        <div class="volume-control-wrapper">
            <button id="music-toggle" onclick="toggleMusic()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">🔊</button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)">
        </div>
    </div>

    <div id="intro-screen" class="screen">
        <h1 class="main-title">TEACHER ANGELA'S<br>BATTLE QUIZ</h1>
        <div style="display:flex; gap:20px;">
            <button class="btn" style="background: linear-gradient(45deg, #00c853, #b2ff59); color:#000;" onclick="showCharSelect()">Enter Arena ▶</button>
            <button class="btn" style="background: #333;" onclick="openSettings()">Armory ⚙</button>
        </div>
    </div>

    <div id="char-select-screen" class="screen">
        <div class="quit-btn-container"><button class="btn" style="background:#333;" onclick="goBackToStart()">⬅ Retreat</button></div>
        <h2 style="font-size:28px; margin: 10px 0; text-shadow: 0 0 10px var(--accent-glow); text-transform:uppercase;">Select Your Fighters</h2>
        <div style="display: flex; gap: 30px; margin-bottom: 10px;">
            <div id="p1-indicator" style="color: var(--p1-color); font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 50px; border: 2px solid var(--p1-color);">P1: SCANNING...</div>
            <div id="p2-indicator" style="color: var(--p2-color); font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 50px; border: 2px solid var(--p2-color);">P2: WAITING...</div>
        </div>
        <div class="char-grid" id="char-grid"></div>
        <div style="margin: 20px 0; display:flex; gap:20px; align-items:center;">
            <div class="mode-selector" style="display:flex; gap:10px;">
                <button id="mode-simul" class="mode-btn active" onclick="setMode('simultaneous')" style="padding:10px 15px; border-radius:8px; cursor:pointer;">SIMULTANEOUS</button>
                <button id="mode-turn" class="mode-btn" onclick="setMode('turn')" style="padding:10px 15px; border-radius:8px; cursor:pointer;">TURN-BASED</button>
            </div>
            <button id="start-battle-btn" class="btn" style="visibility:hidden;" onclick="saveAndStart()">START!</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="quit-btn-container"><button class="btn" style="background:rgba(0,0,0,0.4); font-size:14px; padding:10px 20px;" onclick="goBackToStart()">⬅ QUIT</button></div>
        
        <div class="player-side" id="side-0">
            <div class="health-bar-container"><div id="hp-0" class="health-fill"></div></div>
            <div id="name-0" style="text-align:center; font-weight:bold; color:var(--p1-color); text-transform:uppercase; font-size:14px;">Striker One</div>
            <div class="avatar-wrapper" id="wrapper-0"><div class="avatar-display" id="avatar-0"></div></div>
            <div class="quiz-container" id="quiz-cont-0">
                <div class="question-box" id="q-0">...</div>
                <div class="quiz-content-row">
                    <div id="img-q-0" class="q-image-square"></div>
                    <div class="options-grid" id="opt-0"></div>
                </div>
            </div>
        </div>

        <div class="player-side" id="side-1">
            <div class="health-bar-container"><div id="hp-1" class="health-fill"></div></div>
            <div id="name-1" style="text-align:center; font-weight:bold; color:var(--p2-color); text-transform:uppercase; font-size:14px;">Striker Two</div>
            <div class="avatar-wrapper" id="wrapper-1"><div class="avatar-display" id="avatar-1"></div></div>
            <div class="quiz-container" id="quiz-cont-1">
                <div class="question-box" id="q-1">...</div>
                <div class="quiz-content-row">
                    <div id="img-q-1" class="q-image-square"></div>
                    <div class="options-grid" id="opt-1"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="result-screen" class="screen" style="background: rgba(0,0,0,0.9);">
        <h1 id="winner-announcement" style="font-family: 'Bungee Spice', cursive; font-size: 60px; text-align:center;"></h1>
        <button class="btn" onclick="goBackToStart()">Restart Protocol</button>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <span onclick="closeSettings()" style="position:absolute; right:20px; top:10px; font-size:40px; cursor:pointer; color:red;">&times;</span>
            <h2 style="text-align:center; color:var(--accent-glow);">ARMORY DATABASE</h2>
            <div id="sentence-container"></div>
            <button class="btn" onclick="addSentenceRow()" style="width:100%; margin:10px 0;">+ Add Question</button>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex:1; background:#444;" onclick="exportData()">Export</button>
                <button class="btn" style="flex:1; background:#444;" onclick="document.getElementById('import-file').click()">Import</button>
            </div>
            <input type="file" id="import-file" style="display:none" onchange="importData(this)">
        </div>
    </div>

    <script>
        const DEFAULT_BANK = [
            { text: "The quick brown fox ___ over the dog.", options: ["jumps", "runs", "eats", "sleeps"], correct: "jumps", image: null },
            { text: "Which color is the sun?", options: ["yellow", "green", "blue", "purple"], correct: "yellow", image: null },
            { text: "I ___ English every day.", options: ["study", "dance", "swim", "cry"], correct: "study", image: null }
        ];

        let sentenceBank = JSON.parse(JSON.stringify(DEFAULT_BANK));
        let playerPools = [[], []]; 
        let playerSelection = [null, null];
        let hps = [100, 100];
        let gameMode = 'simultaneous';
        let currentTurn = 0;
        let isGameOver = false;

        window.onload = () => { renderCharSelect(); renderSentenceBank(); };

        function setMode(m) {
            gameMode = m;
            document.getElementById('mode-simul').className = m === 'simultaneous' ? 'mode-btn active' : 'mode-btn';
            document.getElementById('mode-turn').className = m === 'turn' ? 'mode-btn active' : 'mode-btn';
        }

        function renderCharSelect() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = Array.from({length:10}, (_,i) => `
                <div class="char-card" id="char-${i+1}" onclick="selectChar(${i+1})">
                    <img src="${i+1}.png">
                    <div style="font-size:10px; opacity:0.6;">UNIT-${(i+1).toString().padStart(2,'0')}</div>
                </div>
            `).join('');
        }

        function selectChar(num) {
            if (playerSelection[0] === null) {
                playerSelection[0] = num; document.getElementById(`char-${num}`).classList.add('selected-p1');
                document.getElementById('p1-indicator').innerText = "P1: ONLINE";
            } else if (playerSelection[1] === null && playerSelection[0] !== num) {
                playerSelection[1] = num; document.getElementById(`char-${num}`).classList.add('selected-p2');
                document.getElementById('p2-indicator').innerText = "P2: ONLINE";
                document.getElementById('start-battle-btn').style.visibility = 'visible';
            }
        }

        function showCharSelect() { 
            document.getElementById('intro-screen').style.display = 'none'; 
            document.getElementById('char-select-screen').style.display = 'flex'; 
        }

        function saveAndStart() {
            isGameOver = false;
            hps = [100, 100];
            
            playerPools[0] = [...sentenceBank].sort(() => Math.random() - 0.5);
            playerPools[1] = [...sentenceBank].sort(() => Math.random() - 0.5);

            document.getElementById('char-select-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            document.getElementById('avatar-0').style.backgroundImage = `url(${playerSelection[0]}.png)`;
            document.getElementById('avatar-1').style.backgroundImage = `url(${playerSelection[1]}.png)`;
            
            applyMirroring(0, document.getElementById('avatar-0'));
            applyMirroring(1, document.getElementById('avatar-1'));

            updateHPDisplay(0); updateHPDisplay(1);
            loadQuestion(0); loadQuestion(1);

            if(gameMode === 'turn') { currentTurn = 0; updateTurnUI(); }
            else { 
                document.getElementById('quiz-cont-0').classList.remove('waiting'); 
                document.getElementById('quiz-cont-1').classList.remove('waiting'); 
            }
        }

        function applyMirroring(pIdx, el) {
            const charNum = playerSelection[pIdx];
            const isDefaultRight = charNum <= 5;
            const scale = (pIdx === 0) ? (isDefaultRight ? 1 : -1) : (isDefaultRight ? -1 : 1);
            el.dataset.mirror = scale;
            el.style.transform = `scaleX(${scale})`;
        }

        function loadQuestion(pIdx) {
            if (isGameOver) return;
            const qObj = playerPools[pIdx][Math.floor(Math.random() * playerPools[pIdx].length)];
            
            document.getElementById(`q-${pIdx}`).innerText = qObj.text;
            const imgBox = document.getElementById(`img-q-${pIdx}`);
            if(qObj.image) { imgBox.style.display = 'block'; imgBox.style.backgroundImage = `url(${qObj.image})`; } 
            else { imgBox.style.display = 'none'; }

            let options = [...qObj.options].sort(() => Math.random() - 0.5);
            document.getElementById(`opt-${pIdx}`).innerHTML = options.map(opt => `
                <button class="option-btn" 
                    ontouchstart="handleAnswer(${pIdx}, '${opt.replace(/'/g, "\\'")}', '${qObj.correct.replace(/'/g, "\\'")}')"
                    onclick="if(!('ontouchstart' in window)) handleAnswer(${pIdx}, '${opt.replace(/'/g, "\\'")}', '${qObj.correct.replace(/'/g, "\\'")}')">
                    ${opt}
                </button>
            `).join('');
        }

        function handleAnswer(pIdx, selected, correct) {
            if (isGameOver) return;
            if (gameMode === 'turn' && pIdx !== currentTurn) return;

            const opponentIdx = pIdx === 0 ? 1 : 0;

            if (selected.toLowerCase() === correct.toLowerCase()) {
                document.getElementById(`sfx-p${pIdx+1}-attack`).play();
                animateAttack(pIdx);
                hps[opponentIdx] = Math.max(0, hps[opponentIdx] - 20);
                setTimeout(() => triggerDamageFeedback(opponentIdx), 400);
            } else {
                document.getElementById(`sfx-p${pIdx+1}-lose`).play();
                hps[pIdx] = Math.max(0, hps[pIdx] - 5);
                triggerDamageFeedback(pIdx);
            }

            updateHPDisplay(0); updateHPDisplay(1);
            checkWin();

            if (!isGameOver) {
                if (gameMode === 'turn') { currentTurn = opponentIdx; updateTurnUI(); }
                loadQuestion(pIdx);
            }
        }

        function animateAttack(pIdx) {
            const avatar = document.getElementById(`avatar-${pIdx}`);
            const charNum = playerSelection[pIdx];
            const mirror = avatar.dataset.mirror;
            
            // Switch to GIF
            avatar.style.backgroundImage = `url(${charNum}.gif?t=${Date.now()})`;
            
            // Full screen dash distance calculation
            const dashDistance = pIdx === 0 ? 600 : -600;
            
            avatar.style.transition = "transform 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1)";
            avatar.style.transform = `translateX(${dashDistance}px) scaleX(${mirror}) scale(1.2)`;
            
            setTimeout(() => {
                avatar.style.transition = "transform 0.3s ease-in";
                avatar.style.transform = `translateX(0) scaleX(${mirror})`;
                setTimeout(() => {
                    avatar.style.backgroundImage = `url(${charNum}.png)`;
                }, 300);
            }, 500);
        }

        function triggerDamageFeedback(pIdx) {
            const side = document.getElementById(`side-${pIdx}`);
            const avatar = document.getElementById(`avatar-${pIdx}`);
            side.classList.add('damage-flash-screen');
            avatar.classList.add('shiver');
            setTimeout(() => {
                side.classList.remove('damage-flash-screen');
                avatar.classList.remove('shiver');
            }, 600);
        }

        function updateHPDisplay(pIdx) {
            document.getElementById(`hp-${pIdx}`).style.width = hps[pIdx] + '%';
        }

        function checkWin() {
            if (hps[0] <= 0) endGame("PLAYER 2");
            else if (hps[1] <= 0) endGame("PLAYER 1");
        }

        function endGame(winner) {
            isGameOver = true;
            document.getElementById('winner-announcement').innerText = winner + " VICTORIOUS!";
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
        }

        function updateTurnUI() {
            document.getElementById('quiz-cont-0').classList.toggle('waiting', currentTurn !== 0);
            document.getElementById('quiz-cont-1').classList.toggle('waiting', currentTurn !== 1);
        }

        function goBackToStart() {
            location.reload();
        }

        function toggleMusic() {
            const bgm = document.getElementById('bg-music');
            if(bgm.paused) { bgm.play(); document.getElementById('music-toggle').innerText = "🔊"; } 
            else { bgm.pause(); document.getElementById('music-toggle').innerText = "🔇"; }
        }

        function changeVolume(val) { document.getElementById('bg-music').volume = val; }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function openSettings() { renderSentenceBank(); document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        
        function renderSentenceBank() {
            const container = document.getElementById('sentence-container');
            container.innerHTML = sentenceBank.map((item, qIdx) => `
                <div class="sentence-row">
                    <input type="text" value="${item.text}" onchange="sentenceBank[${qIdx}].text=this.value" style="width:80%; padding:5px; margin-bottom:10px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                        ${item.options.map((opt, oIdx) => `
                            <input type="text" value="${opt}" onchange="sentenceBank[${qIdx}].options[${oIdx}]=this.value; if('${item.correct}'==='${opt}') sentenceBank[${qIdx}].correct=this.value" style="padding:3px;">
                        `).join('')}
                    </div>
                    <p style="font-size:12px;">Correct: <input type="text" value="${item.correct}" onchange="sentenceBank[${qIdx}].correct=this.value" style="width:100px;"></p>
                    <button onclick="sentenceBank.splice(${qIdx},1); renderSentenceBank()" style="color:red;">Delete</button>
                </div>
            `).join('');
        }

        function addSentenceRow() {
            sentenceBank.push({ text: "New Question?", options: ["A", "B", "C", "D"], correct: "A", image: null });
            renderSentenceBank();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(sentenceBank)], {type: "application/json"});
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "QuizData.json"; a.click();
        }

        function importData(input) {
            const reader = new FileReader();
            reader.onload = (e) => { sentenceBank = JSON.parse(e.target.result); renderSentenceBank(); };
            reader.readAsText(input.files[0]);
        }
    </script>
</body>
</html>
